esphome:
  name: s3-devkit
  friendly_name: s3 devkit
  min_version: 2025.7.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/ssieb/esphome_components
    components: [ serial ]

# Enable logging
logger:
  level: INFO
#  hardware_uart: uart0

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "S3-Devkit Fallback Hotspot"
    password: "Q3t0iAdgFvjQ"

captive_portal:

switch:
  - platform: restart
    name: "Combivox esp32 restart"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 60s

usb_host:
  enable_hubs: False
  devices: 
    - pid: 0x0000
      vid: 0x0000
      id: any
usb_uart:
  id: combivox_uart
  type: CDC_ACM
  vid: 0x04D8
  pid: 0x000A
  channels: 
    - id: usb_channel
      debug: True

globals:
  - id: combivox_cmd_index
    type: int
    initial_value: '0'

interval:
  - interval: 500ms
    then:
      - lambda: |-
          auto *channel = id(usb_channel);

          if (id(combivox_cmd_index) == 0) {
            channel->write_str(":010000500602A7\r\n");
            ESP_LOGI("combivox", "TX stato_zone");
            id(combivox_cmd_index) = 1; 
          } else {
            channel->write_str(":010000500601A8\r\n");
            ESP_LOGI("combivox", "TX stato_inserimento");
            id(combivox_cmd_index) = 0;
          }

# Text sensor per leggere i dati dalla porta seriale
text_sensor:
  - platform: serial
    uart_id: usb_channel
    # name: My Serial data
    id: raw_data_received
    on_value:
      then:
        - lambda: |-
            std::string received_data = x;
            ESP_LOGD("combivox", "RX: %s", received_data.c_str());

            // Gestione della risposta in base al comando inviato
            if (id(combivox_cmd_index) == 0) {
              // Pubblicazione grezza per "stato_zone"
              ESP_LOGI("combivox", "Risposta stato_zone: %s", received_data.c_str());
              id(stato_zone).publish_state(received_data);

              // Parsing per "stato_zone" (bitmask 8 bit)
              if (received_data.length() >= 2) {
                std::string hex_byte = received_data.substr(0, 2); // Estrae i primi 2 caratteri (8 bit)
                uint8_t byte_value = strtoul(hex_byte.c_str(), nullptr, 16);

                // Decodifica la bitmask e aggiorna i binary_sensor
                id(zona1).publish_state(byte_value & (1 << 0));  // Zona 1 (bit 0)
                id(zona2).publish_state(byte_value & (1 << 1));  // Zona 2 (bit 1)
                id(zona3).publish_state(byte_value & (1 << 2));  // Zona 3 (bit 2)
                id(zona4).publish_state(byte_value & (1 << 3));  // Zona 4 (bit 3)
                id(zona5).publish_state(byte_value & (1 << 4));  // Zona 5 (bit 4)
                id(zona6).publish_state(byte_value & (1 << 5));  // Zona 6 (bit 5)
                id(zona7).publish_state(byte_value & (1 << 6));  // Zona 7 (bit 6)
                id(zona8).publish_state(byte_value & (1 << 7));  // Zona 8 (bit 7)
              }

              // Parsing per "allarme_zone" (secondo byte, posizione 50-51)
              if (received_data.length() >= 52) {  // Verifica che la stringa sia abbastanza lunga
                std::string hex_byte_allarme = received_data.substr(50, 2); // Byte 50-51 (8 bit)
                uint8_t byte_allarme = strtoul(hex_byte_allarme.c_str(), nullptr, 16);
                // Aggiorna i binary_sensor per gli allarmi delle zone
                id(allarme_zona1).publish_state(byte_allarme & (1 << 0));  // Allarme Zona 1 (bit 0)
                id(allarme_zona2).publish_state(byte_allarme & (1 << 1));  // Allarme Zona 2 (bit 1)
                id(allarme_zona3).publish_state(byte_allarme & (1 << 2));  // Allarme Zona 3 (bit 2)
                id(allarme_zona4).publish_state(byte_allarme & (1 << 3));  // Allarme Zona 4 (bit 3)
                id(allarme_zona5).publish_state(byte_allarme & (1 << 4));  // Allarme Zona 5 (bit 4)
                id(allarme_zona6).publish_state(byte_allarme & (1 << 5));  // Allarme Zona 6 (bit 5)
                id(allarme_zona7).publish_state(byte_allarme & (1 << 6));  // Allarme Zona 7 (bit 6)
                id(allarme_zona8).publish_state(byte_allarme & (1 << 7));  // Allarme Zona 8 (bit 7)
              }
            } else {
              // Pubblicazione grezza per "stato_inserimento"
              ESP_LOGI("combivox", "Risposta stato_inserimento: %s", received_data.c_str());
              id(stato_inserimento).publish_state(received_data);

              // Analisi del primo byte per determinare lo stato di inserimento
              if (received_data.length() >= 2) {
                std::string hex_byte = received_data.substr(0, 2);
                uint8_t byte_value = strtoul(hex_byte.c_str(), nullptr, 16);

                // Determina lo stato di inserimento
                if ((byte_value & 0x7F) == 0x7F) {  // 01111111 (tutti i bit tranne il primo sono 1)
                  id(stato_inserimento_testuale).publish_state("Inserimento totale");
                } else if (byte_value == 0x00) {  // 00000000 (tutti i bit sono 0)
                  id(stato_inserimento_testuale).publish_state("Disinserito");
                } else {  // Alcuni bit sono 1, altri 0
                  id(stato_inserimento_testuale).publish_state("Inserimento parziale");
                }
              }

            }

  - platform: template
    id: stato_zone
    name: "Stato Zone Combivox"
    lambda: |-
      return {};
    update_interval: never

  - platform: template
    id: stato_inserimento
    name: "Stato Inserimento Combivox"
    lambda: |-
      return {};
    update_interval: never

  - platform: template
    id: stato_inserimento_testuale
    name: "Stato Inserimento"
    lambda: |-
      return {};
    update_interval: never

