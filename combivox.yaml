esphome:
  name: s3-devkit
  friendly_name: s3 devkit
  min_version: 2025.7.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO
#  hardware_uart: uart0

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "S3-Devkit Fallback Hotspot"
    password: "Q3t0iAdgFvjQ"

captive_portal:

switch:
  - platform: restart
    name: "Combivox esp32 restart"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 60s

usb_host:
  enable_hubs: False
  devices: 
    - pid: 0x0000
      vid: 0x0000
      id: any
usb_uart:
  id: combivox_uart
  type: CDC_ACM
  vid: 0 # 0x04D8
  pid: 0 # 0x000A
  channels: 
    - id: usb_channel
      debug: True

globals:
  - id: combivox_cmd_index
    type: int
    initial_value: '0'

text_sensor:
  - platform: template
    name: "Stato Zone Combivox"
    id: stato_zone

  - platform: template
    name: "Stato Inserimento Combivox"
    id: stato_inserimento

interval:
  - interval: 500ms
    then:
      - lambda: |-
          auto *channel = id(usb_channel);
          static std::string rx_buffer;
          uint8_t c;

          // Alternanza dei comandi
          if (id(combivox_cmd_index) == 0) {
            channel->write_str(":010000500602A7\r\n");
            ESP_LOGI("combivox", "TX stato_zone");
            id(combivox_cmd_index) = 1;
          } else {
            channel->write_str(":010000500601A8\r\n");
            ESP_LOGI("combivox", "TX stato_inserimento");
            id(combivox_cmd_index) = 0;
          }

          delay(100);

          // Ricezione risposta
          while (channel->read_byte(&c)) {
            if (c == '\n' || c == '\r') {
              if (!rx_buffer.empty()) {
                ESP_LOGD("combivox", "USB RX: %s", rx_buffer.c_str());

                // ⚠️ Qui dobbiamo capire a quale sensore pubblicare
                // Guardiamo l’ultimo comando trasmesso
                if (id(combivox_cmd_index) == 1) {
                  // L'ultimo giro ho mandato lo "zone"
                  id(stato_zone).publish_state(rx_buffer);
                  ESP_LOGI("combivox", "Publish stato_zone: %s", rx_buffer.c_str());
                } else {
                  // L'ultimo giro ho mandato "inserimento"
                  id(stato_inserimento).publish_state(rx_buffer);
                  ESP_LOGI("combivox", "Publish stato_inserimento: %s", rx_buffer.c_str());
                }

                rx_buffer.clear();
              }
            } else {
              rx_buffer += static_cast<char>(c);
            }
          }
